[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-mcp-lite"
version = "0.1.0"
description = "Free MCP server that analyzes Oracle AWR/ASH reports offline and gives DBA tuning advice"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BLUEGEM"}]
keywords = ["mcp", "model-context-protocol", "oracle", "awr", "ash", "dba", "performance-tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]
dependencies = ["mcp[cli]>=1.20,<2"]

[project.urls]
Homepage = "https://github.com/bluegemsk/oracle-mcp-lite"
Repository = "https://github.com/bluegemsk/oracle-mcp-lite"
"Full version" = "https://bluegem.sk/oracle-mcp"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "build>=1.0", "twine>=5"]

[project.scripts]
oracle-mcp-lite = "oracle_mcp_lite.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
